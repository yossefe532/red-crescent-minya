name = "red-crescent-minya"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Local development settings
[dev]
ip = "0.0.0.0"
port = 8787

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "red-crescent-minya"
database_id = "3ef5df17-01db-4f33-b331-ed498116da81"

# R2 Bucket binding (enable R2 in Cloudflare Dashboard first)
# [[r2_buckets]]
# binding = "AUDIO_BUCKET"
# bucket_name = "red-crescent-minya-audio"

# Workers AI binding for the smart Telegram bot (NLU for colloquial Arabic)
[ai]
binding = "AI"

# Environment variables (secrets via wrangler secret put)
[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"
AUDIO_RETENTION_DAYS = "90"
# TELEGRAM_BOT_TOKEN is set via .dev.vars (local) and Cloudflare Secrets (production)

# Production environment
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://red-crescent-minya.pages.dev"
AUDIO_RETENTION_DAYS = "90"
# TELEGRAM_BOT_TOKEN set via Cloudflare Secrets

[env.production.ai]
binding = "AI"

[[env.production.d1_databases]]
binding = "DB"
database_name = "red-crescent-minya"
database_id = "3ef5df17-01db-4f33-b331-ed498116da81"
