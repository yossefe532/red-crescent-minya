name = "red-crescent-minya"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Local development settings
[dev]
ip = "0.0.0.0"
port = 8787

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "red-crescent-minya"
database_id = "local-d1"

# R2 Bucket binding
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "red-crescent-minya-audio"

# Environment variables (secrets via wrangler secret put)
[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"
AUDIO_RETENTION_DAYS = "90"
TELEGRAM_BOT_TOKEN = ""

# Production environment
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://red-crescent-minya.pages.dev"
AUDIO_RETENTION_DAYS = "90"
